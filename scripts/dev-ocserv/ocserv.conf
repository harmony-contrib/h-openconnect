# Reference config for local H-OpenConnect testing.
# scripts/dev-ocserv.sh writes a docker-tuned copy into .dev-ocserv/ocserv.conf
# on each start; this file documents the intended settings.

auth = "plain[passwd=/etc/ocserv/ocpasswd]"
tcp-port = 443
udp-port = 443

server-cert = /etc/ocserv/server-cert.pem
server-key = /etc/ocserv/server-key.pem
ca-cert = /etc/ocserv/server-cert.pem

cisco-client-compat = true
dtls-legacy = true

ipv4-network = 10.10.10.0
ipv4-netmask = 255.255.255.0
dns = 1.1.1.1
dns = 8.8.8.8
tunnel-all-dns = true
route = default
mtu = 1400
