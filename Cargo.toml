[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/harmony-contrib/h-openconnect"
homepage = "https://github.com/harmony-contrib/h-openconnect"
rust-version = "1.89"

[workspace.dependencies]
hopenconnect_core = { path = "crates/hopenconnect_core", default-features = false }
arkit = { git = "https://github.com/richerfu/arkit.git", rev = "d8eb33ca4b26c1fad1f4ccb332b433cc756e9dfd", features = ["router", "shadcn"] }
# Pluginized platform capabilities from openharmony-ability. Keep these on the
# same crates.io release as the openharmony-ability version selected by Arkit.
openharmony-ability-plugin-url = "1.0.0-beta.1"
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
napi-build-ohos = "1.1"
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", features = ["napi8", "tokio_rt"] }
ohos-ashmem-binding = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
