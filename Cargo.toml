[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hanyconnect_core = { path = "crates/hanyconnect_core", default-features = false }
arkit = { path = "../../ohos-rs/arkit/crates/arkit", package = "arkit", features = ["router", "shadcn"] }
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
napi-build-ohos = "1.1"
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", features = ["napi8", "tokio_rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
