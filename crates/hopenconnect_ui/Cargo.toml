[package]
name = "hopenconnect_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "H-OpenConnect Arkit UI + NAPI shell over hopenconnect_core / anyconnect-rs"

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[features]
default = []
# Full OpenConnect session (auth + CSTP + TUN mainloop) via anyconnect-rs.
native-anyconnect = ["hopenconnect_core/native-anyconnect"]

[dependencies]
arkit.workspace = true
dioxus.workspace = true
hopenconnect_core.workspace = true
napi-derive-ohos.workspace = true
napi-ohos.workspace = true
openharmony-ability-plugin-url.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true
