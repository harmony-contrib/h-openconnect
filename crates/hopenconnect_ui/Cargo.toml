[package]
name = "hopenconnect_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "H-OpenConnect thin N-API binding over hopenconnect_app and hopenconnect_core"

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[features]
default = []
# Full OpenConnect session (auth + CSTP + TUN mainloop) via anyconnect-rs.
native-anyconnect = ["hopenconnect_core/native-anyconnect"]

[dependencies]
hopenconnect_app.workspace = true
hopenconnect_core.workspace = true
libc = "0.2"
napi-derive-ohos.workspace = true
napi-ohos.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true

[lints]
workspace = true
